name: Scheduled Bread Data Injection

on:
  schedule:
    - cron: '0 2 2 11 *'
    - cron: '0 7 2 11 *'
  workflow_dispatch:   

jobs:
  inject-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Sign into Azure Portal Cloud
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get Current Time and Upload Target Data
      shell: bash
      run: |
        RunnerIP=$(curl -sL https://ifconfig.me)
        echo "Whitelisting GitHub Runner IP: $RunnerIP"
        
        # 1. Flip the master switch to allow firewall rules to function
        az storage account update --resource-group rg-secure-storage-prod --name storagesecurebreadprod01 --public-network-access Enabled --default-action Deny
        
        # 2. Add the temporary runner IP whitelist exception
        az storage account network-rule add --resource-group rg-secure-storage-prod --account-name storagesecurebreadprod01 --ip-address $RunnerIP
        
        # 3. Give Azure time to propagate the networking rule changes
        sleep 45
        
        CurrentHourMYT=$(date -u -d "+8 hours" +"%H")
        FileName="bread_sales_log.csv"
        
        if [ "$CurrentHourMYT" -eq 10 ]; then
            echo "id,bread_type,quantity,sale_time" > $FileName
            echo "1,Sourdough,2,10:00 AM" >> $FileName
        elif [ "$CurrentHourMYT" -eq 15 ]; then
            echo "id,bread_type,quantity,sale_time" > $FileName
            echo "1,Cheese,3,03:00 PM" >> $FileName
        else
            echo "id,bread_type,quantity,sale_time" > $FileName
            echo "1,White Bread,5,Now" >> $FileName
        fi

        # 4. Securely upload the payload using Entra ID authorization tokens
        az storage blob upload --account-name storagesecurebreadprod01 --container-name bread-inventory --name $FileName --file $FileName --auth-mode login --overwrite true

    - name: Re-lock Storage Firewall (Safety Net)
      if: always()
      shell: bash
      run: |
        RunnerIP=$(curl -sL https://ifconfig.me)
        
        # 5. Clean up the firewall rule footprint
        az storage account network-rule remove --resource-group rg-secure-storage-prod --account-name storagesecurebreadprod01 --ip-address $RunnerIP
        
        # 6. Re-seal the storage account to a completely locked-down state
        az storage account update --resource-group rg-secure-storage-prod --name storagesecurebreadprod01 --public-network-access Disabled
        echo "Storage account successfully locked back down."
